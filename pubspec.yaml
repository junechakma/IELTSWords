name: ielts_words
description: "Upword: upgrade every word. IELTS writing and listening vocabulary practice."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^2.6.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascots/
    - assets/data/vocab/
    - assets/maps/
